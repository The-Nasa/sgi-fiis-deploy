services:
  db:
    image: postgres:15-alpine
    container_name: sgi-fiis-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-db_fiis_investigacion}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-db_fiis_investigacion}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgi-fiis-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-db_fiis_investigacion}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres123}
      SPRING_FLYWAY_ENABLED: "true"
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-mi-clave-secreta-super-segura-de-al-menos-256-bits-para-hmac-sha256-fiis}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads-fiis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sgi-fiis-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
