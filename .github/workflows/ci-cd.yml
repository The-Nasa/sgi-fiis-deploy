name: CI/CD SGI-FIIS AWS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci_frontend:
    name: CI Frontend (Build Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npx vite build

  ci_backend:
    name: CI Backend (Build Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build package
        working-directory: backend/fiis
        run: mvn -B clean package -DskipTests

  deploy_aws:
    name: CD Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs:
      - ci_frontend
      - ci_backend
    # Solo se ejecuta si se han configurado los secretos en GitHub Secrets
    if: ${{ secrets.AWS_HOST != '' && secrets.AWS_SSH_KEY != '' }}

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/aws_ec2_key
          chmod 600 ~/.ssh/aws_ec2_key
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on AWS EC2 with Docker Compose
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/aws_ec2_key ${{ secrets.AWS_USER || 'ubuntu' }}@${{ secrets.AWS_HOST }} << 'EOF'
            set -e

            # Navegar a la carpeta del proyecto en el servidor
            if [ -d "~/sgi-fiis-deploy" ]; then
              cd ~/sgi-fiis-deploy
              git fetch origin
              git reset --hard origin/main
            else
              git clone https://github.com/The-Nasa/sgi-fiis-deploy.git ~/sgi-fiis-deploy
              cd ~/sgi-fiis-deploy
            fi

            # Levantar contenedores actualizados
            docker compose up -d --build

            # Limpiar imágenes obsoletas
            docker image prune -f

            docker compose ps
          EOF
